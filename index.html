<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Immortal Empire v1.2 — WebGL District</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c16;color:#ffe4b1;font-family:system-ui,Arial,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}.panel{background:#090d1be0;border:1px solid #b99456;border-radius:12px;padding:10px 12px;max-width:min(78vw,390px);font-size:12px;line-height:1.45}.panel strong{font-size:15px;color:#ffd88e}.muted{color:#c7bba7}.hint{color:#ffda89;margin-top:5px}.status{position:absolute;top:118px;left:12px;right:12px;text-align:center;pointer-events:none;font-size:13px;text-shadow:0 2px 4px #000}.controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.joy{width:128px;height:128px;border-radius:50%;background:#14192ac4;border:2px solid #a58250;position:relative;pointer-events:auto;touch-action:none}.nub{position:absolute;width:52px;height:52px;left:36px;top:36px;border-radius:50%;background:#cba66b;border:2px solid #f7d9a6;box-shadow:0 3px 18px #0008}.buttons{display:flex;flex-direction:column;gap:8px;pointer-events:auto}.btn{background:#10182bdf;color:#ffdda5;border:1px solid #c6a067;border-radius:12px;min-height:51px;min-width:92px;padding:10px;font-weight:700;touch-action:manipulation}.btn:active{background:#51391d}.badge{position:absolute;bottom:166px;left:14px;font-size:11px;color:#fff1d0a6}.error{position:absolute;inset:0;background:#0d1121;color:#fff;padding:30px;display:none;z-index:5}.cross{position:absolute;top:51%;left:50%;transform:translate(-50%,-50%);font-size:18px;opacity:.5;pointer-events:none}.topright{margin-left:auto;pointer-events:auto}.topright button{background:#0b1020d9;color:#f4d39a;border:1px solid #a7834b;border-radius:8px;padding:8px}</style></head><body>
<canvas id="view"></canvas><div class="hud"><div class="panel"><strong>IMMORTAL EMPIRE · v1.3</strong><div class="muted">THE McGOLDRICK LEGACY · TRUE WEBGL 3D</div><div id="stats">Cash $1,000 · Day 1 · 0/4 locations</div><div class="hint" id="mission">Explore Fifth Street. Walk to a glowing entrance.</div></div><div class="topright"><button id="reset">Reset</button></div></div><div class="status" id="status"></div><div class="cross">·</div><div class="badge">Left joystick: walk · Drag right side: rotate camera · INTERACT near doors</div><div class="controls"><div class="joy" id="joy"><div class="nub" id="nub"></div></div><div class="buttons"><button class="btn" id="interact">INTERACT</button><button class="btn" id="camera">CAMERA ↻</button></div></div><div class="error" id="error"></div>
<script>
(()=>{'use strict';const error=document.getElementById('error');const canvas=document.getElementById('view');let gl;try{gl=canvas.getContext('webgl',{antialias:true,alpha:false})||canvas.getContext('experimental-webgl')}catch(e){}if(!gl){error.style.display='block';error.textContent='WebGL is unavailable in this browser. Try Chrome with hardware acceleration enabled.';return}
const vs=`attribute vec3 aPos;attribute vec3 aNormal;attribute vec3 aColor;uniform mat4 uViewProj;uniform vec3 uLight;uniform vec3 uOffset;varying vec3 vColor;void main(){vec3 n=normalize(aNormal);float d=max(dot(n,normalize(uLight)),0.0);vColor=aColor*(0.42+0.58*d);gl_Position=uViewProj*vec4(aPos+uOffset,1.0);}`;
const fs=`precision mediump float;varying vec3 vColor;void main(){gl_FragColor=vec4(vColor,1.0);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let prog;try{prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog))}catch(e){error.style.display='block';error.textContent='Graphics initialization failed: '+e.message;return}gl.useProgram(prog);gl.enable(gl.DEPTH_TEST);gl.clearColor(.065,.085,.145,1);const attrib=['aPos','aNormal','aColor'].map(x=>gl.getAttribLocation(prog,x));const uVP=gl.getUniformLocation(prog,'uViewProj');const uOffset=gl.getUniformLocation(prog,'uOffset');gl.uniform3f(gl.getUniformLocation(prog,'uLight'),-.4,1,.65);
const positions=[],normals=[],colors=[];const palette={road:[.16,.18,.22],sidewalk:[.38,.38,.4],grass:[.14,.27,.21],gold:[1,.66,.22],dark:[.08,.10,.14],glass:[.12,.37,.47],red:[.46,.12,.18],purple:[.34,.17,.53],teal:[.10,.35,.39],bronze:[.44,.25,.13],white:[.8,.77,.7],skin:[.73,.52,.36],black:[.06,.07,.1],roof:[.12,.12,.15],lane:[.94,.74,.36]};
function tri(a,b,c,n,col){for(const p of [a,b,c]){positions.push(...p);normals.push(...n);colors.push(...col)}}function quad(a,b,c,d,n,col){tri(a,b,c,n,col);tri(a,c,d,n,col)}
function box(x,y,z,w,h,d,col){const X=x-w/2,Y=y,Z=z-d/2,x2=x+w/2,y2=y+h,z2=z+d/2;quad([X,Y,z2],[x2,Y,z2],[x2,y2,z2],[X,y2,z2],[0,0,1],col);quad([x2,Y,Z],[X,Y,Z],[X,y2,Z],[x2,y2,Z],[0,0,-1],col);quad([X,Y,Z],[X,Y,z2],[X,y2,z2],[X,y2,Z],[-1,0,0],col);quad([x2,Y,z2],[x2,Y,Z],[x2,y2,Z],[x2,y2,z2],[1,0,0],col);quad([X,y2,z2],[x2,y2,z2],[x2,y2,Z],[X,y2,Z],[0,1,0],col);quad([X,Y,Z],[x2,Y,Z],[x2,Y,z2],[X,Y,z2],[0,-1,0],col)}
function buildWorld(){box(0,-.2,0,100,.15,130,palette.grass);box(0,-.1,0,12,.11,130,palette.road);for(const x of [-8,8])box(x,-.07,0,4,.11,130,palette.sidewalk);for(let z=-60;z<65;z+=8)box(0,-.018,z,.18,.02,3.6,palette.lane);for(let z=-60;z<60;z+=12){box(-6.05,.01,z,.14,.04,5,palette.white);box(6.05,.01,z,.14,.04,5,palette.white)}
const buildings=[[-16,-22,12,11,12,palette.red],[-16,10,11,9,10,palette.teal],[16,-22,12,12,12,palette.purple],[16,10,12,10,11,palette.bronze]];buildings.forEach(([x,z,w,h,d,col],i)=>{box(x,0,z,w,h,d,col);box(x,h,z,w+.6,.6,d+.6,palette.roof);const front=x<0?x+w/2+.035:x-w/2-.035;box(front,0,z, .13,3,2.5,palette.dark);for(let y=4;y<h-1;y+=3.2)for(let dz=-d/2+2;dz<d/2-1;dz+=3.1)box(front,y,z+dz,.15,1.5,1.35,palette.glass);box(front,3.4,z,.18,.25,4,palette.gold);box(x<0?-9.4:9.4,.05,z,1,.08,1,palette.gold)});
for(let z=-50;z<60;z+=16){for(const x of [-10,10]){box(x,0,z,.55,3,.55,palette.dark);box(x,3,z,.8,.7,.8,palette.gold);box(x,0,z+3,.7,.6,.7,palette.grass)}}for(let z=-55;z<60;z+=14){const x=z%3===0?-29:29;box(x,0,z,8,5+(z+60)%5,8,palette.dark);box(x,5+(z+60)%5,z,8.4,.3,8.4,palette.roof)}}
function mesh(){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);const count=positions.length/3;const data=new Float32Array(count*9);for(let i=0;i<count;i++){data.set(positions.slice(i*3,i*3+3),i*9);data.set(normals.slice(i*3,i*3+3),i*9+3);data.set(colors.slice(i*3,i*3+3),i*9+6)}gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);return {b,count}}
buildWorld();const world=mesh();positions.length=0;normals.length=0;colors.length=0;
function character(x,z,angle=0){const base=positions.length/3;box(x,0,z,.72,1.1,.45,palette.black);box(x,1.08,z,.85,1.0,.5,palette.white);box(x,2.05,z,.55,.6,.53,palette.skin);box(x,2.55,z,.58,.15,.56,palette.black);box(x-.57,1.18,z,.26,.85,.3,palette.white);box(x+.57,1.18,z,.26,.85,.3,palette.white);box(x-.22,0,z,.23,.8,.3,palette.black);box(x+.22,0,z,.23,.8,.3,palette.black);return base}
character(0,0);const actor=mesh();positions.length=0;normals.length=0;colors.length=0;
function perspective(fov,aspect,near,far){let f=1/Math.tan(fov/2);return [f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]}
function lookAt(eye,target){const sub=(a,b)=>a.map((v,i)=>v-b[i]);const norm=v=>{let l=Math.hypot(...v)||1;return v.map(x=>x/l)};const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];const z=norm(sub(eye,target)),x=norm(cross([0,1,0],z)),y=cross(z,x);return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-x.reduce((s,v,i)=>s+v*eye[i],0),-y.reduce((s,v,i)=>s+v*eye[i],0),-z.reduce((s,v,i)=>s+v*eye[i],0),1]}
function multiply(a,b){const o=new Array(16).fill(0);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
const places=[{name:'TATTOOED PAWN',x:-9.4,z:-22,reward:350},{name:"HOUY'S STUDIO",x:-9.4,z:10,reward:275},{name:'STUDIO 33',x:9.4,z:-22,reward:500},{name:'BLOODLINES ARENA',x:9.4,z:10,reward:700}];const key='ie-v12-webgl-save';let save;try{save=JSON.parse(localStorage.getItem(key))}catch(e){}if(!save||!Number.isFinite(save.cash)||!Array.isArray(save.done))save={cash:1000,day:1,done:[]};let px=0,pz=34,yaw=0,stickX=0,stickY=0,last=performance.now(),notice='';const stats=document.getElementById('stats'),mission=document.getElementById('mission'),status=document.getElementById('status');function refresh(){stats.textContent=`Cash $${save.cash.toLocaleString()} · Day ${save.day} · ${save.done.length}/4 locations`;mission.textContent=notice||'Explore Fifth Street. Walk to a glowing entrance.'}refresh();function nearest(){let best=null,dist=1e9;for(const p of places){let d=Math.hypot(px-p.x,pz-p.z);if(d<dist){dist=d;best=p}}return {p:best,d:dist}}
function interact(){const {p,d}=nearest();if(d>5){notice='Move closer to a gold entrance marker.'}else if(save.done.includes(p.name)){notice=p.name+' already activated.'}else{save.done.push(p.name);save.cash+=p.reward;save.day++;notice=p.name+' activated · +$'+p.reward+' · '+save.done.length+'/4';try{localStorage.setItem(key,JSON.stringify(save))}catch(e){}}refresh()}document.getElementById('interact').addEventListener('click',interact);document.getElementById('reset').addEventListener('click',()=>{if(confirm('Reset mission and cash progress?')){save={cash:1000,day:1,done:[]};px=0;pz=34;notice='';try{localStorage.removeItem(key)}catch(e){}refresh()}});document.getElementById('camera').addEventListener('click',()=>yaw+=Math.PI/2);
const joy=document.getElementById('joy'),nub=document.getElementById('nub');function joyUpdate(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),factor=Math.min(1,len/44);stickX=dx/len*factor;stickY=dy/len*factor;nub.style.transform=`translate(${stickX*40}px,${stickY*40}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyUpdate(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))joyUpdate(e)});function joyEnd(){stickX=stickY=0;nub.style.transform='translate(0,0)'}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
let drag=null;canvas.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.35){drag={id:e.pointerId,x:e.clientX};canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){yaw+=(e.clientX-drag.x)*.007;drag.x=e.clientX}});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function draw(m){gl.bindBuffer(gl.ARRAY_BUFFER,m.b);for(let i=0;i<3;i++){gl.enableVertexAttribArray(attrib[i]);gl.vertexAttribPointer(attrib[i],3,gl.FLOAT,false,36,i*12)}gl.drawArrays(gl.TRIANGLES,0,m.count)}function resize(){const dpr=Math.min(devicePixelRatio||1,1.7),w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;let forward=-stickY+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),side=stickX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);const mag=Math.max(1,Math.hypot(forward,side));forward/=mag;side/=mag;const speed=8;px+=((Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt);pz+=((-Math.cos(yaw)*forward+Math.sin(yaw)*side)*speed*dt);px=Math.max(-40,Math.min(40,px));pz=Math.max(-58,Math.min(58,pz));const near=nearest();status.textContent=near.d<5?`Near ${near.p.name} · tap INTERACT`:'';resize();gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const eye=[px-Math.sin(yaw)*10,8.0,pz+Math.cos(yaw)*10],target=[px,1.6,pz];const vp=multiply(perspective(Math.PI/3,canvas.width/canvas.height,.1,220),lookAt(eye,target));gl.uniformMatrix4fv(uVP,false,new Float32Array(vp));gl.uniform3f(uOffset,0,0,0);draw(world);gl.uniform3f(uOffset,px,0,pz);draw(actor);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
